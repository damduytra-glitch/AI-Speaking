project:
  seed: 42
  device: cpu

paths:
  transformer_models_dir: transformer_models
  pronunciation_checkpoint: transformer_models/pronunciation.pt
  checkpoint_dir: checkpoints
  log_dir: logs
  cmudict_path: null

audio_preprocess:
  sample_rate: 16000
  peak_normalize: true
  target_peak: 0.95
  highpass_hz: 80.0
  denoise: true
  denoise_prop: 0.75
  speech_normalize: true
  speech_thresh_db: -35.0
  vad_frame_ms: 25.0
  vad_hop_ms: 10.0

inference:
  device: cpu
  max_audio_duration_sec: 3600
  max_duration_sec: null
  max_upload_mb: 300

asr:
  model_name: openai/whisper-large-v3
  language: en
  device: cpu
  torch_dtype: float32
  max_new_tokens: 440
  lang_id:
    enabled: false
    drop_languages: [vi, vie, vietnamese]
    min_confidence: 0.45
    text_vi_regex: false

eligibility:
  min_duration_sec: 1.0
  min_words: 2
  backchannel_words:
    - yes
    - no
    - yeah
    - yep
    - ok
    - okay
    - sure
    - uh
    - um
    - ah
    - hmm
    - right
    - alright
    - oh
    - cool
    - thank you
    - thanks
    - bye
    - bye bye
    - hello
    - hi

wavlm:
  model_name: microsoft/wavlm-large
  freeze: true
  use_lora: true
  lora_r: 8
  lora_alpha: 16
  lora_target_modules: [q_proj, v_proj]

transformer:
  num_layers: 3
  num_heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_seq_len: 800

ctc_align:
  use_wavlm_ctc_head: true

phoneme_graph:
  hidden_dim: 256
  num_gat_layers: 2
  num_heads: 4
  dropout: 0.1
  edge_types:
    sequential: true
    same_word: true
    same_syllable: false

multitask:
  hidden_dim: 256
  dropout: 0.1
  utterance_aspects: [accuracy, fluency, completeness, prosodic, total]
  word_aspects: [accuracy, stress, total]
  phoneme_aspects: [accuracy]
  score_scale: 5.0

scorer:
  weights:
    utterance_total: 0.5
    word_total: 0.25
    phoneme_accuracy: 0.25
  phoneme_low_threshold: 1.2

sentence_split:
  min_silence_sec: 0.35
  silence_thresh_db: -40
  min_segment_sec: 0.2
  max_segment_sec: null
  padding_sec: 0.1
  trim_edges: false
  trim_min_sec: 0.05
  diarization_merge_gap_sec: 0.2
